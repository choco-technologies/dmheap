name: CI

on:
  push:
    branches: [ master, main, develop, copilot/*, feature/* ]
  pull_request:
    branches: [ master, main, develop, feature/* ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: chocotechnologies/dmod:1.0.2
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y lcov
    
    - name: Configure CMake
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release -DDMHEAP_BUILD_TESTS=ON
    
    - name: Build
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --verbose
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: build/Testing/
        retention-days: 30
    
    - name: Upload benchmark results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results
        path: build/benchmark_results.json
        retention-days: 30
        if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    container:
      image: chocotechnologies/dmod:1.0.2
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install dependencies
      run: |
        apt-get update
        apt-get install -y lcov
    
    - name: Configure CMake with coverage
      run: |
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON -DDMHEAP_BUILD_TESTS=ON
    
    - name: Build with coverage
      run: |
        cd build
        make -j$(nproc)
    
    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure
    
    - name: Generate coverage report
      run: |
        cd build
        lcov --directory . --capture --output-file coverage.info
        lcov --remove coverage.info '/usr/*' '*/build/_deps/*' --output-file coverage_filtered.info --ignore-errors unused
        lcov --list coverage_filtered.info
    
    - name: Generate HTML coverage report
      run: |
        cd build
        mkdir -p coverage_html
        genhtml coverage_filtered.info --output-directory coverage_html
    
    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: build/coverage_html/
        retention-days: 30
    
    - name: Coverage summary
      run: |
        cd build
        echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        lcov --summary coverage_filtered.info 2>&1 | tee -a $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-tools:
    name: Build memory (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, xtensa/esp32s3]
    container:
      image: chocotechnologies/dmod:1.0.4

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Build memory module
      run: |
        cd tools/memory
        mkdir -p build
        cd build
        cmake .. -DDMOD_MODE=DMOD_MODULE -DDMOD_TOOLS_NAME=arch/${{ matrix.arch }}
        cmake --build .

    - name: Upload memory package
      uses: actions/upload-artifact@v4
      with:
        name: memory-${{ strategy.job-index }}
        path: tools/memory/build/packages/memory.zip
